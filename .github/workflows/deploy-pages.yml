# Deploys the test branch to GitHub Pages.
# config.js is generated from repo secrets at deploy time (it is gitignored),
# reusing the same generate-config.js script Netlify uses.
#
# One-time GitHub setup required:
#   1. Repo Settings → Pages → Source: "GitHub Actions" (instead of "Deploy from a branch")
#   2. Repo Settings → Secrets and variables → Actions → New repository secret, add:
#      SUPABASE_URL, SUPABASE_ANON, RAPIDAPI_KEY

name: Deploy test site to GitHub Pages

on:
  push:
    branches: [test]
  workflow_dispatch:   # allows manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate config.js from secrets
        run: node generate-config.js
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          RAPIDAPI_KEY:  ${{ secrets.RAPIDAPI_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
